name: audit-eval

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline golden evaluation
        run: python evals/run_eval.py
      - name: Verify report artifact
        run: test -s evals/report_latest.md
